name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Calidad
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7

      - name: Instalar uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Formato
        run: uv run ruff format --check .

      - name: Tipos
        run: uv run mypy

      - name: Pruebas (sin las de integración)
        run: uv run pytest -m "not integracion"
