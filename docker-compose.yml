services:
  # Perfil "entrenamiento": MLflow para registrar experimentos y modelos.
  # Backend store en SQLite y artefactos en disco local: alcanza para uso en
  # solitario y evita sumar un contenedor de Postgres solo para esto.
  #
  # También corre en el perfil "servicio": la API necesita hablarle a MLflow para
  # cargar el modelo con el alias `campeon` al arrancar.
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.16.1
    profiles: ["entrenamiento", "servicio"]
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlflow
    # --allowed-hosts mlflow: el contenedor "api" del perfil "servicio" le habla como
    # "http://mlflow:5000"; sin este flag, MLflow rechaza el request por su protección
    # contra DNS rebinding (el header Host no es "localhost" ni una IP privada).
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root mlflow-artifacts:/
      --artifacts-destination /mlflow/artefactos
      --host 0.0.0.0
      --port 5000
      --workers 1
      --allowed-hosts localhost,mlflow:5000
    mem_limit: 1536m
    restart: unless-stopped

  # Perfil "servicio": API FastAPI que sirve al campeón vigente del registro de MLflow.
  api:
    build:
      context: .
      dockerfile: despliegue/servicio/Dockerfile
    profiles: ["servicio"]
    ports:
      - "8000:8000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      - mlflow
    mem_limit: 1024m
    restart: unless-stopped

  # Perfil "tiempo-real": broker de Kafka en modo KRaft (sin ZooKeeper), un solo nodo que
  # es a la vez broker y controlador. Dos listeners de cliente: uno para el host
  # (localhost:9092, lo usa el productor que corre con `uv run`) y otro para el resto de
  # los contenedores de la red de Compose (kafka:19092, lo va a usar Spark Streaming).
  # Cada listener anuncia una dirección distinta porque un cliente tiene que poder
  # resolver la dirección que el broker le informa, y "localhost" adentro de otro
  # contenedor no es el broker.
  kafka:
    image: apache/kafka:4.3.1
    profiles: ["tiempo-real"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNO://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNO://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNO:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNO
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Con un solo nodo no se puede replicar: todo en 1 (los defaults de Kafka esperan 3).
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Los tópicos se crean a propósito (make kafka-crear-topico), no por accidente.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Heap de la JVM acotado: el límite del contenedor tiene que cubrir heap + memoria fuera del heap.
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    mem_limit: 1024m
    restart: unless-stopped
